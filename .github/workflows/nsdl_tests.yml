name: NSDL Pipeline Tests

on:
  push:
    paths:
      - 'scripts/fetch_nsdl_*.py'
      - 'scripts/send_nsdl_issuance_report.py'
      - 'tests/**'
      - '.github/workflows/nsdl_tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytest

      - name: Run parser tests
        run: pytest -q tests/
